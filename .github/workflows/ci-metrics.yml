name: CI metrics

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-metrics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: CI metrics report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Summarize the last seven days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runCiMetrics = require("./.github/scripts/ci-metrics.cjs");
            await runCiMetrics({ github, context, core });
